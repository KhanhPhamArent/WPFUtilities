name: UserStory
description: UserStory用のテンプレート / Template for new user story development
title: "[UserStory]"
body:
  - type: dropdown
    id: categories_classification
    attributes:
      label: Categories
      description: このタスクのCategoryを選択してください
      options:
        - UserStory
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## 注意事項 / Notes
        - 明確な受け入れ基準の記入をお願いします。 / Please provide clear acceptance criteria.
        - 要件定義・設計ドキュメントのリンクを必ず添付してください。 / Please ensure to attach a link to the requirements and design documentation.

  - type: markdown
    attributes:
      value: |
        ## 要件定義・設計ドキュメント / Requirements & Design Documentation

  - type: input
    id: notion-link
    attributes:
      label: Notionリンク / Notion Link
      description: 要件定義・設計ドキュメントのNotionリンクを記載してください / Paste the Notion link for requirements and design documentation
      placeholder: https://www.notion.so/arent/...

  - type: textarea
    id: user-story-description
    attributes:
      label: 説明（テキスト）/ Description (Text)
      description: 機能の概要や補足説明を記載してください / Describe the user story overview and additional information
      placeholder: |
        ## 機能概要 / Feature Overview
        -

        ## 補足事項 / Additional Notes
        -

  - type: markdown
    attributes:
      value: |
        ## 受け入れ基準 / Acceptance Criteria

  - type: textarea
    id: acceptance-description
    attributes:
      label: 説明（テキスト）/ Description (Text)
      description: 受け入れ基準を記載してください / Describe the acceptance criteria
      value: |
        ## 受け入れ基準 / Acceptance Criteria
        - [ ] ...が正常に動作すること
        - [ ] ...の機能が実装されていること
        - [ ] ...のエラーが発生しないこと

  - type: input
    id: acceptance-model
    attributes:
      label: 確認モデル / Verification Model
      description: 受け入れ基準を確認するモデルのGoogle Driveリンクを記載してください / Paste the Google Drive link for the verification model
      placeholder: https://drive.google.com/...

  - type: input
    id: target-release
    attributes:
      label: ブランチ or リリース対象 / Target Branch or Release
      description: 対象となるブランチやリリースを記載してください / Specify the target branch or release
      placeholder: https://github.com/ArentInc/kandenkou-revit-addin/...