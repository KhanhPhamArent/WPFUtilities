name: Version-Update-For-Aqua

on:
  workflow_dispatch:
  schedule:
    - cron: 0 1 * * 3 # At AM10:00 JST on Wednesday

jobs:
  aqua-update:
    runs-on: ubuntu-24.04
    timeout-minutes: 1

    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - run: cat "$GITHUB_EVENT_PATH"

      - name: Enable Git long paths
        run: git config --global core.longpaths true

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: aquaproj/aqua-installer@11dd79b4e498d471a9385aa9fb7f62bb5f52a73c # v4.0.4
        with:
          aqua_version: v2.48.1

      - name: aqua update (only packages)
        run: aqua update -p
        shell: bash

      # is change happen?
      - name: Check for modified files
        id: git-check
        run: echo "modified=$(if git diff-index --quiet HEAD --; then echo "false"; else echo "true"; fi)" >> "$GITHUB_OUTPUT"

      # Commit if change happen, then create PR. force push when branch/pr already exists.
      - name: Create Pull Request
        if: steps.git-check.outputs.modified == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # v8.1.0
        with:
          branch: "${{ env.WORKING_BRANCH }}"
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          delete-branch: true
          commit-message: "[aqua update] Automated changes"
          title: "[aqua update] Automated changes"
          body: aqua update generated changes
          labels: automated pr
        env:
          WORKING_BRANCH: auto-pr/aqua-update/${{ github.ref_name }}

      - name: Check outputs
        if: steps.git-check.outputs.modified == 'true'
        run: |
          echo "Pull Request Number - ${{ steps.cpr.outputs.pull-request-number }}"
          echo "Pull Request URL - ${{ steps.cpr.outputs.pull-request-url }}"
